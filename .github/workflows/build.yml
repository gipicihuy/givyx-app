name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for version detection

      - name: Determine version from tag
        id: version
        run: |
          # Check if this is a tag push
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
            echo "Building version: $TAG"
          else
            # For branch pushes, find the latest version tag
            LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -n "$LATEST_TAG" ]; then
              echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
              echo "Building with version: $LATEST_TAG"
            else
              echo "version=1.0.0-dev" >> $GITHUB_OUTPUT
              echo "No version tag found, using dev version"
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > app/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease --stacktrace -PgitSha=${{ github.sha }} -PversionName=${{ steps.version.outputs.version }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug APK (PRs)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --stacktrace -PgitSha=${{ github.sha }}

      - name: Upload release APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: givy-downloader-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 5

      - name: Upload debug APK artifact (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: givy-downloader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
